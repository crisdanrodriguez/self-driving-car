[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "self-driving-car"
version = "0.1.0"
description = "Steering-angle prediction for the Udacity self-driving car simulator."
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "Flask>=3.0,<3.1",
    "Pillow>=10.0,<12.0",
    "matplotlib>=3.7,<3.10",
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8,<5.0",
    "pandas>=2.0,<2.3",
    "python-engineio>=4.9,<5.0",
    "python-socketio>=5.11,<6.0",
    "scikit-learn>=1.3,<1.6",
    "scipy>=1.11,<1.14",
    "eventlet>=0.35,<0.41; platform_system != 'Windows'",
    "tensorflow>=2.15,<2.17; python_version < '3.12' and platform_system != 'Darwin'",
    "tensorflow-macos>=2.15,<2.17; python_version < '3.12' and platform_system == 'Darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
dev = [
    "black>=24.3,<25.0",
    "flake8>=7.0,<8.0",
    "isort>=5.13,<6.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
]

[project.scripts]
train-steering-model = "self_driving_car.train:main"
run-simulator-bridge = "self_driving_car.inference:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310", "py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
